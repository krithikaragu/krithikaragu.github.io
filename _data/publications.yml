sections:
  - category: "Works in Progress"
    papers:
      - title: "Permit Banking in Cap-and-Trade Markets with Auctions"
        abstract: |
          Cap-and-trade markets represent a unique multi-unit auction setting in which agents make intertemporal savings decisions: pollution permits won in uniform price auctions can be banked across compliance periods without expiry. In this paper, I ask how the option to bank permits affects bidding, consumption, revenues and welfare. Under the assumption of normally distributed signals and linear valuations, I solve a two-period model of repeated uniform price auctions with consumption-savings decisions. I find that when costs are convex, bidders are more price-elastic and banking effectively reduces market power and mitigates the demand reduction effect in multi-unit auctions noted in \cite{ausubel2014demand}. Further, with the option to bank, bidders are less sensitive to signals. Banked permits transmit aggregated signal noise across periods via bids which amplifies price variance over time, rather than reducing it.

      - title: "Revenue-Maximizing Two-Sided Matching Mechanisms"
        abstract: |
          This paper studies how permit banking changes bidding incentives, bid shading, and auction revenue in uniform-price auctions.

  - category: "Non-Economics"
