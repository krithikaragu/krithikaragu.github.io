sections:
  - category: "Works in Progress"
    papers:
      - title: "Permit Banking in Cap-and-Trade Markets with Auctions"
        abstract: |
          This paper studies optimal matching mechanisms in double-auction environments with two-sided private information.

      - title: "Revenue-Maximizing Two-Sided Matching Mechanisms"
        abstract: |
          This paper studies how permit banking changes bidding incentives, bid shading, and auction revenue in uniform-price auctions.

  - category: "Non-Economics"
    papers:
      - title: "Numerical Solutions of Thin Film Equations for Polymer Flows"
        abstract: |
          This paper studies numerical methods for thin film equations arising in polymer flow applications.

      - title: "Low Shear Diffusion Central Schemes for Particle Methods"
        abstract: |
          This paper develops low-shear-diffusion central schemes for particle-based numerical methods.
